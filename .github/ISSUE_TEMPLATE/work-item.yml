name: Shepherd work item
description: Claim one HANDOVER task, defect, assurance check, or PRD requirement.
title: "[TASK-ID] "
body:
  - type: markdown
    attributes:
      value: |
        Read `docs/HANDOVER.md` before claiming work. One issue is owned by one agent at a time. Open a linked draft PR immediately after assignment.
  - type: input
    id: task-id
    attributes:
      label: HANDOVER task ID
      description: Use the stable ID from docs/HANDOVER.md. Do not invent a duplicate ID.
      placeholder: GC-01
    validations:
      required: true
  - type: input
    id: prd-reference
    attributes:
      label: PRD reference
      description: Cite every affected docs/PRD.md section or state that this is an operational task.
      placeholder: PRD 4.1 Goal 12; 8.1; 11.5; 11.6 journey 3
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Current behavior and evidence
      description: Include the assessed commit, reproduction, and existing test or handover evidence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and acceptance criteria
      description: State observable outcomes, negative cases, and the evidence required before completion.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Owned scope
      description: List expected files/modules and explicitly excluded adjacent work.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and stack position
      description: List blockers, parent issue/PR/branch, dependants, or "independent from main".
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: List targeted, adjacent, full, browser, live, security, and post-merge checks. Mark non-applicable checks explicitly.
    validations:
      required: true
  - type: checkboxes
    id: gates
    attributes:
      label: Required gates
      options:
        - label: The change will be the smallest coherent fix and will preserve existing behavior outside this issue.
          required: true
        - label: Material UI work will preserve `docs/UI.jpeg` and the existing visual language, and will be browser-verified at 1280x800 and 1440x900.
        - label: Material security/trust-boundary work will receive independent security review.
        - label: Live model/API calls will be opt-in, sparse, bounded, and never print credentials.
